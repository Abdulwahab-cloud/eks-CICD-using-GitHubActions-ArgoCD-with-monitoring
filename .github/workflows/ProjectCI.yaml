name: ProjectCI

on:
    push:
        branches: ["main"]

jobs: 
    Builds-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v5.0.0

            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build & Push Frontend
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-frontend:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-frontend:${{ github.sha }}

            - name: Build & Push API
              uses: docker/build-push-action@v5
              with:
                context: ./api-service
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-api:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-api:${{ github.sha }}
            
            - name: Build & Push worker
              uses: docker/build-push-action@v5
              with:
                context: ./worker-service
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-worker:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/arket-worker:${{ github.sha }}

    update-manifests:
        name: Update image tags in gitops repo
        runs-on: ubuntu-latest
        needs: [Builds-and-push]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
                - name: Checkout gitops repo
                  uses: actions/checkout@v4
                  with:
                    token: ${{ secrets.GITOPS_TOKEN }}
                    
            
                - name: Update image tags
                  run: |
                    
            
                    TAG="${{ github.sha }}"
                    DOCKERHUB="${{ secrets.DOCKERHUB_USERNAME }}"
            
                    sed -i "s|image: ${DOCKERHUB}/arket-api:.*|image: ${DOCKERHUB}/arket-api:${TAG}|" k8s/api.yaml
                    sed -i "s|image: ${DOCKERHUB}/arket-worker:.*|image: ${DOCKERHUB}/arket-worker:${TAG}|" k8s/worker.yaml
                    sed -i "s|image: ${DOCKERHUB}/arket-frontend:.*|image: ${DOCKERHUB}/arket-frontend:${TAG}|" k8s/frontend.yaml
 
                - name: Commit and push
                  run: |
                        git config user.name  "github-actions[bot]"
                        git config user.email "github-actions[bot]@users.noreply.github.com"
                        git add k8s/api.yaml k8s/worker.yaml k8s/frontend.yaml
                        git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
                        git push         