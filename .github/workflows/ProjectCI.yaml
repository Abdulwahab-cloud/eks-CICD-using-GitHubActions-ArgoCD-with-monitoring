name: ProjectCI

on:
    push:
        branches: ["main"]

jobs: 
    Builds-and-push:
        runs-on: ubunto-latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v5.0.0

            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker login
              uses: docker/login-action@v3
              with:
                username: $ {{ secrets.DOCKER_USENAME }}
                password: $ {{ secrets.DOCKER_PASSWORD }}

            - name: Build & Push Frontend
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: |
                    ${{ secrets.DOCKER_USENAME }}/arket-frontend:latest
                    ${{ secrets.DOCKER_USENAME }}/arket-frontend:${GITHUB_SHA::7}

            - name: Build & Push API
              uses: docker/build-push-action@v5
              with:
                context: ./api
                push: true
                tags: |
                    ${{ secrets.DOCKER_USENAME }}/arket-api:latest
                    ${{ secrets.DOCKER_USENAME }}/arket-api:${GITHUB_SHA::7}
            
            - name: Build & Push worker
              uses: docker/build-push-action@v5
              with:
                context: ./worker
                push: true
                tags: |
                    ${{ secrets.DOCKER_USENAME }}/arket-worker:latest
                    ${{ secrets.DOCKER_USENAME }}/arket-worker:${GITHUB_SHA::7}

            