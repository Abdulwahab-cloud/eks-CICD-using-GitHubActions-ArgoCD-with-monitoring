apiVersion: v1
kind: Secret
metadata:
  name: arket-secrets
  namespace: arket
  labels:
    app: arket
type: Opaque
# Values are base64 encoded
# To encode:  echo -n "my-value" | base64
# To decode:  echo "bXktdmFsdWU=" | base64 -d
stringData:
  API_SECRET_KEY: "arket-super-secret-key-change-in-prod"
  # In production: store in AWS Secrets Manager or Vault
  # and use External Secrets Operator to sync them here