apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: arket
spec:
  parentRefs:
    - name: arket-gateway
      namespace: arket
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: arket
spec:
  parentRefs:
    - name: arket-gateway
      namespace: arket
      sectionName: http 
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worker-route
  namespace: arket
spec:
  parentRefs:
    - name: arket-gateway
      namespace: arket
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jobs
      backendRefs:
        - name: worker-service
          port: 5000