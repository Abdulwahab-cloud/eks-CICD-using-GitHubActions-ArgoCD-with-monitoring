apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arket
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.app/argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Abdulwahab-cloud/eks-CICD-using-GitHubActions-ArgoCD-with-monitoring
    targetRevision: main
    path: k8s/

  destination:
    server: https://kubernetes.default.svc
    namespace: arket

  syncPolicy:
    automated:
      prune: true      
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true
   